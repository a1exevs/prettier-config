name: Project build

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: |
          npm install -g corepack@0.31.0
          corepack enable
          yarn install

      - name: Styling
        run: |
          yarn format
          yarn lint

      - name: Project build
        run: yarn build
